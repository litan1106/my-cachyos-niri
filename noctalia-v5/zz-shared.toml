[accessibility]
ui_scale = 1.25

[bar.default]
position = "top"
margin_edge = 0
margin_ends = 0
background_opacity = 0.93
thickness = 35
widget_spacing = 6
start = []
center = ["launcher", "menu_gap", "workspaces", "window_gap", "active_window"]
end = ["media", "tray", "notifications", "battery", "volume", "brightness", "clock", "control-center"]

[widget.launcher]
glyph = "brand-finder"
custom_image = "/usr/share/icons/cachyos.svg"
scale = 1.6
capsule_padding = 0

[widget.menu_gap]
type = "spacer"
length = 8

[widget.window_gap]
type = "spacer"
length = 8

[shell]
font_family = "Adwaita Sans"

[shell.launcher]
layout = "full"
default_view = "all"
app_grid = true
categories = true
sort_by_usage = true
search_position = "bottom"
show_session_button = true

[shell.panel]
launcher_placement = "floating"
launcher_position = "center"
control_center_placement = "attached"
session_placement = "floating"
session_position = "center"

[dock]
enabled = true
position = "bottom"
auto_hide = true
reserve_space = false
margin_edge = 8
margin_ends = 0
icon_size = 40
show_running = true
show_dots = true
launcher_position = "start"

[theme]
mode = "dark"
source = "builtin"
builtin = "Kanagawa"
