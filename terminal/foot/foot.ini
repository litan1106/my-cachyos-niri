# Mirrors ~/.config/alacritty/alacritty.toml (font, opacity, Noctalia colors)

[main]
font=monospace:size=12
font-bold=monospace:size=12:style=Bold
font-italic=monospace:size=12:style=Italic
font-bold-italic=monospace:size=12:style=Bold Italic
initial-window-size-chars=100x30
pad=4x4 center
bold-text-in-bright=yes

[scrollback]
lines=10000
multiplier=3

[cursor]
style=underline
underline-thickness=2px

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=1f1f28
foreground=dcd7ba
selection-background=2d4f67
selection-foreground=c8c093
cursor=1f1f28 c8c093

regular0=090618
regular1=c34043
regular2=76946a
regular3=c0a36e
regular4=7e9cd8
regular5=957fb8
regular6=6a9589
regular7=c8c093

bright0=727169
bright1=e82424
bright2=98bb6c
bright3=e6c384
bright4=7fb4ca
bright5=938aa9
bright6=7aa89f
bright7=dcd7ba
